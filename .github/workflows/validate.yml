name: Orbit validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Validate shared ARROW shell
        run: |
          node --check public/arrow-shell.js
          grep -q 'data-arrow-os-shell' src/app/page.tsx
          grep -q 'arrow-shell.js' src/app/layout.tsx

      - name: Shared ARROW regression tests
        run: npm run test:shell

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Interaction tests
        run: npm run test:e2e
