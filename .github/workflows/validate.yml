name: Orbit validation

on:
  push:
    branches: [main, beta-foundation-polish-20261023]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Validate shared ARROW shell
        run: |
          node --check public/arrow-shell.js
          grep -q 'data-arrow-os-shell' src/components/orbit-adapt.tsx
          grep -q 'arrow-shell.js' src/app/layout.tsx

      - name: Standalone shell regression tests
        if: github.ref == 'refs/heads/main'
        run: npm run test:shell

      - name: Beta Orbit layout, grid and identity tests
        if: github.ref != 'refs/heads/main'
        run: node --test tests/orbit-adapt.test.cjs tests/orbit-widget-grid.test.cjs tests/orbit-refinement.test.cjs tests/adapt-native.test.cjs tests/module-routing.test.cjs tests/entertainment.test.cjs

      # The integrated beta runs the shared shell suite with Relay's actual
      # arrow-shell.js injected via ARROW_SHELL_SOURCE during packaging.

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Interaction tests
        run: npm run test:e2e
